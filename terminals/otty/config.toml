# Otty configuration — 由 Ghostty 习惯迁移而来
# 热重载:保存即生效(background-opacity 例外,需重开窗口)
# Settings GUI 与本文件双向同步

# ============ 字体 ============
font-family = "CommitMono Nerd Font"
font-family-fallback = ["Maple Mono NF CN"]
font-size = 15

# ============ 主题 ============
# auto-theme-dark-mode 默认开启:浅色用 theme,深色用 theme-dark
theme = "Floating Card"
theme-dark = "Nord"

# ============ 颜色微调(GUI 中调过的 GitHub Light 配色,覆盖主题)============
foreground = "#24292e"
background = "#ffffff"
palette-0 = "#24292e"
palette-1 = "#d73a49"
palette-2 = "#28a745"
palette-3 = "#dbab09"
palette-4 = "#0366d6"
palette-5 = "#5a32a3"
palette-6 = "#0598bc"
palette-7 = "#d4d6d7"
palette-8 = "#959da5"
palette-9 = "#cb2431"
palette-10 = "#22863a"
palette-11 = "#b08800"
palette-12 = "#005cc5"
palette-13 = "#5a32a3"
palette-14 = "#3192aa"
palette-15 = "#d1d5da"
selection-background = "#e4e4e7"
cursor-color = "#18181b"

# ============ 光标 ============
# cursor-style = "block" (reset to default)
# 本机 1.2.3 尚不支持文档里的 default_on/always_on 枚举,仍用布尔值
cursor-style-blink = true

# ============ 背景 ============
background-opacity = 0.9

# ============ 滚动 ============
scrollback-lines = 100000
mouse-scroll-multiplier = "discrete:3.0,precision:2.0"

# ============ 复制/选择 ============
copy-on-select = true
clipboard-read = "allow"

# ============ 工作目录 ============
# 新窗口/新 tab/新分屏均继承当前 pane 目录(tab/split 本就默认 inherit)
window-working-directory = "inherit"

# ============ macOS ============
macos-option-as-alt = "right"

# ============ 快捷键(对齐 Zed/Obsidian 习惯)============
# 本机 1.2.3 用 trigger=action 语法(新版文档是 trigger:action)
keybind = "cmd+b=toggle_tabs_panel"
keybind = "cmd+r=toggle_details_panel"

# ============ 文件关联 / UI ============
open-with-app = "Zed|dev.zed.Zed"
sidebar-width = 165
