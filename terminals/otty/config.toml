# Otty configuration — 由 Ghostty 习惯迁移而来
# 热重载:保存即生效(background-opacity 例外,需重开窗口)
# Settings GUI 与本文件双向同步

# ============ 字体 ============
font-family = "CommitMono Nerd Font"
font-family-fallback = ["Maple Mono NF CN"]

# ============ 主题 ============
# auto-theme-dark-mode 默认开启:浅色用 theme,深色用 theme-dark
theme = "Paper"
theme-dark = "Nord"

# ============ 颜色微调(GUI 中调过的 GitHub Light 配色,覆盖主题)============
foreground = "#1a1a1a"
background = "#fcfbf9"
palette-0 = "#1a1a1a"

# ============ 光标 ============
# cursor-style = "block" (reset to default)
# 本机 1.2.3 尚不支持文档里的 default_on/always_on 枚举,仍用布尔值
cursor-style-blink = "always_on"

# ============ 背景 ============
background-opacity = 0.9

# ============ 滚动 ============
scrollback-lines = 100000
# mouse-scroll-multiplier = "discrete:3.0,precision:2.0" (reset to default)

# ============ 复制/选择 ============
copy-on-select = true
clipboard-read = "allow"

# ============ 工作目录 ============
# 新窗口/新 tab/新分屏均继承当前 pane 目录(tab/split 本就默认 inherit)
window-working-directory = "inherit"

# ============ macOS ============
macos-option-as-alt = "right"

# ============ 快捷键(对齐 Zed/Obsidian 习惯)============
# 本机 1.2.3 用 trigger=action 语法(新版文档是 trigger:action)
keybind = "cmd+b=toggle_tabs_panel"
keybind = "cmd+r=toggle_details_panel"

# ============ 文件关联 / UI ============
open-with-app = "Zed|dev.zed.Zed"
sidebar-width = 141

# omit-otty-prefix = true (reset to default)

# confirm-close-tab = "always" (reset to default)

# confirm-close-window = "always" (reset to default)

# confirm-close-pane = "always" (reset to default)

details-panel-width = 352

privilege-caffeinate-agent-processing = true

notification-foreground = "tab-unfocused"

palette-1 = "#a33a3a"
palette-2 = "#2b5a38"
palette-3 = "#a85a20"
palette-4 = "#4a7a8a"
palette-5 = "#4a3a6a"
palette-6 = "#3a7a6a"
palette-7 = "#c1beb5"
palette-8 = "#8c8a80"
palette-9 = "#c36a6a"
palette-10 = "#6b9a78"
palette-11 = "#c88a50"
palette-12 = "#7a9aaa"
palette-13 = "#8a7a9a"
palette-14 = "#6abaaa"

font-blending = "linear"

font-size = 19

window-layout = "tabs-top"

palette-15 = "#ebebe6"

# selection-foreground = "#2e3440" (reset to default)
# selection-background = "#e5e9f0" (reset to default)
# cursor-color = "#e5e9f0" (reset to default)
# cursor-text = "#2e3440" (reset to default)
