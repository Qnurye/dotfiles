<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Agent 配置 · dotfiles</title>
    <link rel="stylesheet" href="/style.css" />
    <script defer src="/app.js"></script>
  </head>
  <body>
    <header>
      <span class="logo" aria-hidden="true">⌘</span><b>dotfiles</b
      ><span class="slash">/</span><strong>Agent 配置</strong
      ><span id="branch"></span><button id="review">查看变更并提交</button>
    </header>
    <div class="layout">
      <aside>
        <h2>配置范围</h2>
        <nav id="scopes"></nav>
        <div class="repo" id="repo"></div>
      </aside>
      <main>
        <div class="top">
          <div>
            <small id="crumb"></small>
            <h1 id="heading">Universal</h1>
          </div>
          <button id="new">＋ 新建配置</button>
        </div>
        <nav id="groups"></nav>
        <div id="notice" role="status" aria-live="polite"></div>
        <div class="workspace">
          <section class="files">
            <input
              id="filter"
              type="search"
              placeholder="筛选配置…"
              aria-label="筛选配置"
            />
            <div id="files"></div>
          </section>
          <article>
            <div class="docbar">
              <div><b id="title">选择配置</b><small id="path"></small></div>
              <span id="state"></span>
            </div>
            <div id="tools">
              <button id="edit">编辑</button><button id="preview">预览</button
              ><button id="split">对照</button
              ><label class="auto"
                ><input id="autosave" type="checkbox" /> 自动保存</label
              ><button id="save">保存</button>
            </div>
            <p id="note"></p>
            <div id="panes">
              <textarea
                id="editor"
                aria-label="配置源文件"
                spellcheck="false"
                hidden
              ></textarea>
              <div id="render"></div>
            </div>
            <button id="apply" hidden>应用插件策略</button>
          </article>
        </div>
      </main>
    </div>
    <dialog id="createDialog">
      <form id="creation">
        <h2>新建配置</h2>
        <p id="scopeHint"></p>
        <label>类型<select id="kind"></select></label
        ><label id="nameLabel"
          >名称<input
            id="slug"
            pattern="[a-z][a-z0-9]*(-[a-z0-9]+)*"
            placeholder="例如 code-review"
        /></label>
        <p id="hint"></p>
        <footer>
          <button type="button" class="cancel">取消</button
          ><button class="primary">创建</button>
        </footer>
      </form>
    </dialog>
    <dialog id="diffDialog">
      <h2>提交配置变更</h2>
      <p>勾选要提交的完整文件。Worktrunk 会根据所选差异生成提交信息。</p>
      <div id="diffs"></div>
      <p id="diffError" role="status"></p>
      <footer>
        <button class="cancel">关闭</button
        ><button id="commit" class="primary">提交所选文件</button>
      </footer>
    </dialog>
  </body>
</html>
