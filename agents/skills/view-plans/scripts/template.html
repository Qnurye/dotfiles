<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  :root {
    --ink: oklch(0.22 0.01 60);
    --ink-soft: oklch(0.40 0.01 60);
    --ink-muted: oklch(0.55 0.008 60);
    --paper: oklch(0.97 0.008 80);
    --paper-warm: oklch(0.94 0.012 75);
    --paper-deep: oklch(0.91 0.014 72);
    --accent: oklch(0.52 0.12 25);
    --accent-soft: oklch(0.52 0.12 25 / 0.12);
    --rule: oklch(0.22 0.01 60 / 0.12);
    --rule-strong: oklch(0.22 0.01 60 / 0.30);
    --serif: 'Source Serif 4', 'Georgia', serif;
    --sans: 'DM Sans', 'Helvetica Neue', sans-serif;
    --measure: 72ch;
  }

  html {
    font-size: clamp(15px, 1vw + 12px, 18px);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--paper);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Top bar ── */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
    padding: 0 clamp(1.5rem, 4vw, 3rem);
    display: flex;
    align-items: stretch;
    justify-content: space-between;
    gap: 1rem;
  }

  .topbar::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 0;
    right: 0;
    height: 8px;
    background: linear-gradient(var(--paper) 0%, transparent 100%);
    pointer-events: none;
  }

  /* ── Tabs ── */
  .tabs {
    display: flex;
    gap: 0;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    flex: 1;
    min-width: 0;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    font-family: var(--sans);
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-muted);
    background: none;
    border: none;
    padding: 1rem 1.25rem;
    cursor: pointer;
    white-space: nowrap;
    position: relative;
    transition: color 0.2s ease;
  }

  .tab:hover {
    color: var(--ink-soft);
  }

  .tab[aria-selected="true"] {
    color: var(--ink);
    font-weight: 600;
  }

  .tab[aria-selected="true"]::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 1.25rem;
    right: 1.25rem;
    height: 2px;
    background: var(--accent);
  }

  /* ── Language toggle ── */
  .lang-toggle {
    display: flex;
    align-items: center;
    gap: 0;
    flex-shrink: 0;
    align-self: center;
    border: 1px solid var(--rule);
    border-radius: 4px;
    overflow: hidden;
  }

  .lang-btn {
    font-family: var(--sans);
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    padding: 0.35rem 0.75rem;
    background: none;
    border: none;
    color: var(--ink-muted);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .lang-btn:first-child {
    border-right: 1px solid var(--rule);
  }

  .lang-btn[aria-pressed="true"] {
    background: var(--ink);
    color: var(--paper);
  }

  /* ── Content area ── */
  .content {
    max-width: calc(var(--measure) + clamp(3rem, 8vw, 6rem));
    margin: 0 auto;
    padding: clamp(2rem, 5vw, 4rem) clamp(1.5rem, 4vw, 3rem);
  }

  .plan-section {
    display: none;
  }
  .plan-section.active {
    display: block;
  }

  .plan-label {
    font-family: var(--sans);
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 2rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--rule);
  }

  /* ── Markdown prose ── */
  .prose {
    display: none;
  }
  .prose.visible {
    display: block;
  }

  .prose h1 {
    font-family: var(--serif);
    font-size: clamp(1.8rem, 3vw, 2.5rem);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin: 0 0 1.5rem 0;
  }

  .prose h2 {
    font-family: var(--serif);
    font-size: clamp(1.3rem, 2vw, 1.65rem);
    font-weight: 600;
    line-height: 1.25;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin: 3rem 0 0.75rem 0;
    padding-top: 2rem;
    border-top: 1px solid var(--rule);
  }

  .prose h2:first-child {
    margin-top: 0;
    padding-top: 0;
    border-top: none;
  }

  .prose h3 {
    font-family: var(--serif);
    font-size: clamp(1.05rem, 1.4vw, 1.2rem);
    font-weight: 600;
    line-height: 1.35;
    color: var(--ink);
    margin: 2rem 0 0.5rem 0;
  }

  .prose h4 {
    font-family: var(--sans);
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 1.75rem 0 0.5rem 0;
  }

  .prose p {
    font-family: var(--serif);
    font-size: 1rem;
    line-height: 1.75;
    color: var(--ink-soft);
    margin: 0 0 1.25rem 0;
  }

  .prose strong {
    color: var(--ink);
    font-weight: 600;
  }

  .prose em {
    font-style: italic;
  }

  .prose a {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-color: var(--accent-soft);
    text-underline-offset: 2px;
    transition: text-decoration-color 0.15s;
  }
  .prose a:hover {
    text-decoration-color: var(--accent);
  }

  .prose ul, .prose ol {
    font-family: var(--serif);
    color: var(--ink-soft);
    line-height: 1.75;
    margin: 0 0 1.25rem 0;
    padding-left: 1.5rem;
  }

  .prose li {
    margin-bottom: 0.35rem;
  }

  .prose li::marker {
    color: var(--ink-muted);
  }

  .prose blockquote {
    border-left: 3px solid var(--accent);
    padding: 0.5rem 0 0.5rem 1.5rem;
    margin: 1.5rem 0;
    background: var(--accent-soft);
  }

  .prose blockquote p {
    font-style: italic;
    color: var(--ink-soft);
    margin-bottom: 0;
  }

  .prose code {
    font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
    font-size: 0.88em;
    background: var(--paper-warm);
    border: 1px solid var(--rule);
    padding: 0.12em 0.4em;
    border-radius: 3px;
    color: var(--ink);
  }

  .prose pre {
    background: var(--ink);
    color: var(--paper);
    border-radius: 4px;
    padding: 1.25rem 1.5rem;
    margin: 1.5rem 0;
    overflow-x: auto;
    line-height: 1.55;
    font-size: 0.88rem;
  }

  .prose pre code {
    background: none;
    border: none;
    padding: 0;
    color: inherit;
    font-size: inherit;
  }

  .prose hr {
    border: none;
    border-top: 1px solid var(--rule-strong);
    margin: 3rem 0;
  }

  .prose table {
    width: 100%;
    border-collapse: collapse;
    margin: 1.5rem 0;
    font-family: var(--sans);
    font-size: 0.9rem;
  }

  .prose th {
    text-align: left;
    font-weight: 600;
    color: var(--ink);
    padding: 0.6rem 1rem;
    border-bottom: 2px solid var(--rule-strong);
    font-size: 0.8rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .prose td {
    padding: 0.6rem 1rem;
    border-bottom: 1px solid var(--rule);
    color: var(--ink-soft);
    vertical-align: top;
  }

  .prose tr:last-child td {
    border-bottom: none;
  }

  .prose img {
    max-width: 100%;
    height: auto;
    border-radius: 4px;
  }

  /* ── Empty state ── */
  .empty-state {
    text-align: left;
    padding: 4rem 0;
    color: var(--ink-muted);
  }

  .empty-state p {
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.1rem;
  }

  /* ── Entrance animation ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .plan-section.active {
    animation: fadeUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  /* ── Print ── */
  @media print {
    .topbar { position: static; border: none; }
    .lang-toggle { display: none; }
    .content { max-width: none; padding: 0; }
    .prose { display: block !important; }
    .prose + .prose { page-break-before: always; margin-top: 2rem; }
  }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    .topbar {
      flex-direction: column;
      align-items: flex-start;
      padding: 0.5rem clamp(1rem, 3vw, 1.5rem);
      gap: 0.5rem;
    }
    .lang-toggle {
      align-self: flex-end;
      margin-top: -2rem;
    }
    .tab {
      padding: 0.75rem 1rem;
      font-size: 0.75rem;
    }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="tabs" role="tablist" id="plan-tabs"></div>
  <div class="lang-toggle" role="group" aria-label="Language">
    <button class="lang-btn" aria-pressed="true" data-lang="en">EN</button>
    <button class="lang-btn" aria-pressed="false" data-lang="cn">中文</button>
  </div>
</div>

<main class="content" id="content"></main>

<!-- PLANS_DATA -->

<script>
(function() {
  'use strict';

  const plans = (window.__PLANS__ || []);
  const tabsEl = document.getElementById('plan-tabs');
  const contentEl = document.getElementById('content');
  let activePlan = 0;
  let activeLang = 'en';

  if (!plans.length) {
    contentEl.innerHTML = '<div class="empty-state"><p>No plans loaded.</p></div>';
    return;
  }

  // Configure marked
  marked.setOptions({
    gfm: true,
    breaks: false,
  });

  // Build DOM for each plan
  plans.forEach(function(plan, i) {
    // Tab
    var tab = document.createElement('button');
    tab.className = 'tab';
    tab.role = 'tab';
    tab.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
    tab.textContent = plan.name || ('Plan ' + (i + 1));
    tab.dataset.index = i;
    tab.addEventListener('click', function() { switchPlan(i); });
    tabsEl.appendChild(tab);

    // Section
    var section = document.createElement('div');
    section.className = 'plan-section' + (i === 0 ? ' active' : '');
    section.dataset.index = i;

    var label = document.createElement('div');
    label.className = 'plan-label';
    label.textContent = plan.name || ('Plan ' + (i + 1));
    section.appendChild(label);

    var enBlock = document.createElement('div');
    enBlock.className = 'prose visible';
    enBlock.dataset.lang = 'en';
    enBlock.innerHTML = marked.parse(plan.en || '');
    section.appendChild(enBlock);

    var cnBlock = document.createElement('div');
    cnBlock.className = 'prose';
    cnBlock.dataset.lang = 'cn';
    cnBlock.innerHTML = marked.parse(plan.cn || '');
    section.appendChild(cnBlock);

    contentEl.appendChild(section);
  });

  // Language buttons
  document.querySelectorAll('.lang-btn').forEach(function(btn) {
    btn.addEventListener('click', function() { switchLang(btn.dataset.lang); });
  });

  function switchPlan(index) {
    activePlan = index;
    // Update tabs
    tabsEl.querySelectorAll('.tab').forEach(function(t) {
      t.setAttribute('aria-selected', Number(t.dataset.index) === index ? 'true' : 'false');
    });
    // Update sections
    contentEl.querySelectorAll('.plan-section').forEach(function(s) {
      s.classList.toggle('active', Number(s.dataset.index) === index);
    });
  }

  function switchLang(lang) {
    activeLang = lang;
    // Update toggle buttons
    document.querySelectorAll('.lang-btn').forEach(function(btn) {
      btn.setAttribute('aria-pressed', btn.dataset.lang === lang ? 'true' : 'false');
    });
    // Update all prose blocks
    contentEl.querySelectorAll('.prose').forEach(function(p) {
      p.classList.toggle('visible', p.dataset.lang === lang);
    });
  }
})();
</script>

</body>
</html>
